<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Trend 2025–2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --primary: #0f172a;
  --accent: #3b82f6;
  --bg: #f1f5f9;
  --border: #cbd5e1;
  --success: #10b981;
  --danger: #ef4444;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: 360px;
  background: #fff;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width .3s;
}
.sidebar.hidden { width: 0; }
.sidebar.hidden * { display: none; }

.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.search-box {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.item-container { flex: 1; overflow: auto; }
.category-header {
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 700;
  background: #f8fafc;
}
.item-row {
  padding: 10px 16px;
  border: none;
  background: #fff;
  width: 100%;
  display: flex;
  justify-content: space-between;
  cursor: pointer;
  text-align: left;
}
.item-row:hover { background: #f0f9ff; }
.item-row.active {
  background: #eff6ff;
  border-left: 4px solid var(--accent);
  font-weight: 600;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px 30px;
  overflow: auto;
}
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.toggle-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}

.filters {
  display: flex;
  gap: 10px;
}
.filters select {
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 20px 0;
}
.stat-card {
  background: #fff;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
}
.stat-card label {
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
}
.stat-card div {
  font-size: 22px;
  font-weight: 800;
}

.chart-box {
  background: #fff;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--border);
  height: 520px;
}
#chart { cursor: pointer; }
</style>
</head>
  
<body>

<div id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h3 style="margin:0 0 8px 0">Market Monitor</h3>
    <input id="search" class="search-box" placeholder="Search…" oninput="renderList()">
  </div>
  <div id="item-container" class="item-container"></div>
</div>

<div class="main">
  <div class="top-bar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    <div class="filters">
      <select id="from" onchange="applyRange()"></select>
      <select id="to" onchange="applyRange()"></select>
    </div>
  </div>

  <h1 id="disp-name">Select a Commodity</h1>
  <p id="disp-meta" style="color:#64748b"></p>

let chart, selected = null, currentFrom = 0;
    
function initRange(){ 
  const f = document.getElementById("from");
  const t = document.getElementById("to");
  labels.forEach((l, i) => {
    f.add(new Option(l, i));
    t.add(new Option(l, i));
  });
  t.selectedIndex = labels.length - 1;
} 

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("hidden");
  setTimeout(() => chart.resize(), 310);
}

function renderList(){
  const q = document.getElementById("search").value.toLowerCase();
  const c = document.getElementById("item-container");
  c.innerHTML = "";
  let last = "";
  masterData.forEach((d, i) => {
    if(d.name.toLowerCase().includes(q)){
      if(d.cat !== last){
        const h = document.createElement("div");
        h.className = "category-header";
        h.textContent = d.cat;
        c.appendChild(h);
        last = d.cat;
      }
      const b = document.createElement("button");
      b.className = "item-row";
      b.innerHTML = `<span>${d.name}</span>`;
      b.onclick = () => selectItem(i, b);
      c.appendChild(b);
    }
  });
}

function selectItem(i, el){
  document.querySelectorAll(".item-row").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  selected = i;
  applyRange();
}

function applyRange(){
  if(selected === null) return;
  const d = masterData[selected];
  const a = parseInt(document.getElementById("from").value);
  const b = parseInt(document.getElementById("to").value);
  currentFrom = a;

  const sliced = d.p.slice(a, b + 1);
  const lbls = labels.slice(a, b + 1);
  const v = sliced.filter(x => x != null);
  if(!v.length) return;

  document.getElementById("disp-name").innerText = d.name;
  document.getElementById("disp-meta").innerText = d.cat;
  document.getElementById("latest-label").innerText = "Latest";

  // find the full-array index of the last non-null point in the selected range
  let lastFullIndex = a;
  for(let i = sliced.length - 1; i >= 0; i--){
    if(sliced[i] != null){ lastFullIndex = a + i; break; }
  }
  const lastWeekPrice = lastFullIndex > 0 ? d.p[lastFullIndex - 1] : null;

  updateGridUI(v[0], v[v.length - 1], v, d.unit, lastWeekPrice);

  chart.data.labels = lbls;
  chart.data.datasets[0].data = sliced;
  chart.update();
}

// Reusable function to update the Stat Grid
function updateGridUI(startPrice, currentPrice, fullRangeArray, unit, lastWeekPrice){
  const diff = ((currentPrice - startPrice) / startPrice * 100).toFixed(1);
  

  document.getElementById("s2").innerText = "₱" + currentPrice;
  
  const s3 = document.getElementById("s3");
  s3.innerText = diff + "%";
  s3.style.color = diff >= 0 ? "var(--success)" : "var(--danger)";
  
  document.getElementById("s4").innerText = "₱" + Math.min(...fullRangeArray);
  document.getElementById("s5").innerText = "₱" + Math.max(...fullRangeArray); 
  document.getElementById("s6").innerText = unit;
  document.getElementById("s7").innerText = (lastWeekPrice != null) ? "₱" + lastWeekPrice : "--";
}


window.onload = () => {
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        data: [],
        borderColor: "#3b82f6",
        backgroundColor: "rgba(59, 130, 246, 0.1)",
        fill: true,
        spanGaps: true,
        tension: 0.3,
        pointRadius: 4,
        pointHoverRadius: 8,
        pointHitRadius: 10
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      onClick: (e, elements) => {
        if (elements.length > 0 && selected !== null) {
          const index = elements[0].index;
          const dataset = chart.data.datasets[0].data;
          const clickedPrice = dataset[index];
          const startPrice = dataset.find(val => val !== null);
          const dateLabel = chart.data.labels[index];

          if (clickedPrice !== null) {
            // Update labels and values for the clicked date
            document.getElementById("latest-label").innerText = "Price on " + dateLabel;
            
            // Filter out nulls for min/max logic
            const validPoints = dataset.filter(v => v !== null);

            // Last week's price = value immediately preceding this point in the full dataset
            const fullIndex = currentFrom + index;
            const lastWeekPrice = fullIndex > 0 ? masterData[selected].p[fullIndex - 1] : null;

            updateGridUI(startPrice, clickedPrice, validPoints, masterData[selected].unit, lastWeekPrice);
          }
        }
      }
    }
  });
  initRange();
  renderList();
};
